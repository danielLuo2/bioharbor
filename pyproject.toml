[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioharbor"
dynamic = ["version"]
description = "Run real bioinformatics from your AI agent. Reliable, reproducible, on your own GPUs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Daniel Luo" }]
keywords = ["bioinformatics", "mcp", "ai-agents", "gpu", "protein", "genomics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12"]
# RTX 50xx (Blackwell) needs a CUDA 12.8+ build of torch, see docs/gpu-setup.md
esmfold = ["torch>=2.7", "transformers>=4.46", "nvidia-ml-py>=12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bioharbor = "bioharbor.cli:app"

[tool.hatch.version]
path = "src/bioharbor/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
