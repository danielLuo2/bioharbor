name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Install MMseqs2 (runs the homology integration tests)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL https://github.com/soedinglab/MMseqs2/releases/latest/download/mmseqs-linux-avx2.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "BIOHARBOR_MMSEQS=$RUNNER_TEMP/mmseqs/bin/mmseqs" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
